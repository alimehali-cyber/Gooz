name: AR screen emulator smoke test

# Opens the AR sky screen of the real app on an Android emulator (with and without runtime
# permissions, Persian and English, day and night) and reports any crash of the app process, any
# "Application Not Responding" and an in-process profile of the main thread.
# Independent of the APK build workflow: it never gates or replaces build.yml.
# Run on demand only (Actions → "AR screen emulator smoke test" → Run workflow): a push runs just the
# APK build.
on:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  ar-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Build debug app and instrumentation APKs
        run: |
          chmod +x gradlew || true
          ./gradlew assembleDebug assembleDebugAndroidTest -Pgravity.ci.tests=false --no-daemon

      - name: Render the AR and Sky Canvas Moon (Robolectric, native graphics)
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --tests 'com.alijafari.red.astronomy.MoonShowcaseRenderTest' -Pgravity.ci.tests=false --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Open the AR screen on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated
          disable-animations: true
          script: bash .github/scripts/ar-smoke.sh

      - name: Summarise crashes and logs
        if: always()
        run: python3 .github/scripts/ar-smoke-report.py

      - name: Publish diagnostics as check runs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in ar-smoke-out/checks/*.json; do
            [ -f "$f" ] || continue
            gh api "repos/${{ github.repository }}/check-runs" --method POST --input "$f" > /dev/null \
              || echo "::warning title=Check run::could not publish $f"
          done

      - name: Fail on crash, ANR or failed scenario
        if: always()
        run: |
          verdict=$(cat ar-smoke-out/verdict.txt 2>/dev/null || echo missing)
          echo "verdict: $verdict"
          test "$verdict" = "ok"
